# Stub workflow for *this* documentation repo.
# Adopting application repos should implement the full pipeline from docs/devops/CI_CD.md
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required files exist
        run: |
          test -f README.md
          test -f AGENTS.md
          test -f checklists/production.md
          test -f docs/security/SECURITY.md
